[workspace]
members = ["grammar", "server"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
cc = "1.2"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tree-sitter = "0.26.11"
tree-sitter-language = "0.1.7"
